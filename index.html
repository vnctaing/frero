<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>~*~ FRERO.ORG ~*~ La Page Officielle De La Bromance ~*~</title>
  <style>
    @keyframes rainbow { to { filter: hue-rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes wobble { 0%, 100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(3deg) scale(1.03); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ripple { 0% { transform: scale(0.2); opacity: 0; } 15% { opacity: 1; } 100% { transform: scale(14); opacity: 0; } }
    @keyframes orb { to { transform: translate(var(--x), var(--y)) scale(1.6); } }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes drift { to { transform: translateY(300px); } }
    @keyframes aurora { 0% { transform: translate(-5%, -3%) scale(1); } 50% { transform: translate(4%, 3%) scale(1.15); } 100% { transform: translate(-2%, 5%) scale(1.05); } }
    @keyframes shoot { from { opacity: 1; translate: 0 0; } to { opacity: 0; translate: -600px 350px; } }
    @keyframes flicker { 0%, 100% { text-shadow: 0 0 6px #fff, 0 0 12px #ff0, 0 -6px 18px #f80, 0 -12px 24px #f00; } 50% { text-shadow: 0 0 4px #fff, 0 -4px 14px #ff0, 0 -10px 22px #f80, 0 -16px 30px #f00; } }

    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #ff0;
      font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive;
      background: radial-gradient(ellipse at 50% 120%, #4b0082 0%, #1a0040 45%, #05001a 100%) fixed #05001a;
      cursor: crosshair;
    }

    .sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .aurora {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(40% 30% at 20% 30%, rgba(255, 0, 255, 0.45), transparent 70%),
        radial-gradient(35% 25% at 80% 20%, rgba(0, 255, 255, 0.4), transparent 70%),
        radial-gradient(45% 30% at 60% 75%, rgba(120, 0, 255, 0.45), transparent 70%),
        radial-gradient(30% 25% at 15% 85%, rgba(0, 255, 150, 0.3), transparent 70%);
      filter: blur(40px);
      animation: aurora 18s ease-in-out infinite alternate, rainbow 12s linear infinite;
    }
    .vortex {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 250vmax;
      height: 250vmax;
      margin: -125vmax 0 0 -125vmax;
      background: repeating-conic-gradient(from 0deg, rgba(255, 0, 255, 0.18) 0deg 6deg, transparent 6deg 15deg, rgba(0, 255, 255, 0.14) 15deg 21deg, transparent 21deg 30deg);
      mix-blend-mode: screen;
      -webkit-mask: radial-gradient(circle, transparent 3%, #000 25%, transparent 60%);
      mask: radial-gradient(circle, transparent 3%, #000 25%, transparent 60%);
      animation: spin 40s linear infinite, rainbow 9s linear infinite;
    }
    .vortex.reverse {
      background: repeating-conic-gradient(from 7deg, rgba(255, 255, 0, 0.12) 0deg 4deg, transparent 4deg 20deg);
      animation: spin 55s linear infinite reverse, rainbow 14s linear infinite reverse;
    }
    .ripple {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10vmax;
      height: 10vmax;
      margin: -5vmax 0 0 -5vmax;
      border-radius: 50%;
      border: 2px solid rgba(255, 150, 255, 0.6);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(255, 0, 255, 0.5);
      opacity: 0;
      animation: ripple 8s ease-out infinite;
    }
    .ripple:nth-child(4) { animation-delay: -2s; }
    .ripple:nth-child(5) { animation-delay: -4s; }
    .ripple:nth-child(6) { animation-delay: -6s; }
    .orb {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      filter: blur(2px);
      animation: orb var(--d) ease-in-out infinite alternate, rainbow 7s linear infinite;
    }
    .stars, .stars2 {
      position: absolute;
      inset: -300px 0 0;
      background-image:
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 120px 80px, #ffd, transparent),
        radial-gradient(2px 2px at 220px 150px, #aff, transparent),
        radial-gradient(1px 1px at 60px 220px, #fdf, transparent),
        radial-gradient(1.5px 1.5px at 170px 270px, #fff, transparent),
        radial-gradient(2.5px 2.5px at 270px 40px, #fff, transparent);
      background-size: 300px 300px;
      animation: twinkle 3s ease-in-out infinite, drift 60s linear infinite;
    }
    .stars2 {
      background-size: 150px 150px;
      background-position: 70px 40px;
      opacity: 0.7;
      animation-duration: 2.2s, 90s;
      animation-delay: -1.1s, 0s;
    }
    .shooting {
      position: absolute;
      width: 140px;
      height: 2px;
      background: linear-gradient(90deg, #fff, rgba(255, 255, 255, 0));
      border-radius: 2px;
      box-shadow: 0 0 8px #fff, 0 0 16px #f0f;
      transform: rotate(-30deg);
      animation: shoot 1.2s ease-out forwards;
    }

    main {
      position: relative;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    h1 {
      margin: 8px 0 0;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: clamp(2.2rem, 11vw, 6rem);
      letter-spacing: 2px;
      color: #ff0;
      animation: flicker 0.4s infinite, wobble 2s ease-in-out infinite;
    }
    .rainbow {
      background: linear-gradient(90deg, #f00, #f80, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rainbow 2s linear infinite;
    }
    .blink { animation: blink 0.8s steps(1) infinite; }


    main > img { width: min(100%, 900px); height: auto; border-radius: 4px; }
    h2 {
      margin: 0;
      font-size: clamp(1.2rem, 5vw, 2.2rem);
      text-wrap: balance;
      color: #0f0;
      text-shadow: 3px 3px 0 #f0f, 6px 6px 0 #00f;
    }
    .names { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .names span {
      display: inline-block;
      padding: 4px 12px;
      border: 3px outset #ff0;
      background: #800080;
      color: #fff;
      animation: bounce 0.9s ease-in-out infinite;
    }
    .names span:nth-child(2) { animation-delay: 0.15s; background: #008080; }
    .names span:nth-child(3) { animation-delay: 0.3s; background: #800000; }
    .names span:nth-child(4) { animation-delay: 0.45s; background: #008000; }
    .names span:nth-child(5) { animation-delay: 0.6s; background: #000080; }

    .sparkle { position: fixed; pointer-events: none; z-index: 10; }
    .sparkle { font-size: 16px; transition: transform 0.8s ease-out, opacity 0.8s ease-out; }

  </style>
</head>
<body>
  <!-- salut à toi le frero qui a pris la peine d'ouvrir la devtool -->
  <!-- best viewed in Netscape Navigator 4.0 à 800x600 -->
  <div class="sky"><div class="aurora"></div><div class="vortex"></div><div class="vortex reverse"></div><div class="ripple"></div><div class="ripple"></div><div class="ripple"></div><div class="ripple"></div><div class="stars"></div><div class="stars2"></div></div>
  <main>
    <h1>FRERO.ORG</h1>

    <img src="frero.jpg" alt="Les frero">

    <h2 class="blink">LES FRERO DE L'ANNÉE</h2>
    <div class="names">
      <span>Issam</span><span>Neil</span><span>Jocelyn</span><span>Paul</span><span>Thomas</span>
    </div>
    <h2><span class="rainbow">c'est les frero de l'année</span></h2>

  </main>

  <script>
    const glyphs = ["★", "✦", "✧", "♥"];
    const colors = ["#f0f", "#0ff", "#ff0", "#0f0", "#f80"];
    let last = 0;
    document.addEventListener("pointermove", (e) => {
      const now = performance.now();
      if (now - last < 40) return;
      last = now;
      const s = document.createElement("span");
      s.className = "sparkle";
      s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      s.style.color = colors[Math.floor(Math.random() * colors.length)];
      s.style.left = e.clientX + "px";
      s.style.top = e.clientY + "px";
      document.body.appendChild(s);
      requestAnimationFrame(() => {
        s.style.transform = `translate(${Math.random() * 40 - 20}px, 40px) scale(0.2)`;
        s.style.opacity = "0";
      });
      setTimeout(() => s.remove(), 800);
    });

    const sky = document.querySelector(".sky");
    const orbColors = ["#f0f", "#0ff", "#ff0", "#8f0", "#a0f"];
    for (let i = 0; i < 14; i++) {
      const orb = document.createElement("span");
      const size = 10 + Math.random() * 40;
      const color = orbColors[i % orbColors.length];
      orb.className = "orb";
      orb.style.width = orb.style.height = size + "px";
      orb.style.left = Math.random() * 100 + "vw";
      orb.style.top = Math.random() * 100 + "vh";
      orb.style.background = `radial-gradient(circle at 35% 35%, #fff, ${color} 40%, transparent 70%)`;
      orb.style.boxShadow = `0 0 ${size}px ${color}`;
      orb.style.setProperty("--x", Math.random() * 300 - 150 + "px");
      orb.style.setProperty("--y", Math.random() * 300 - 150 + "px");
      orb.style.setProperty("--d", 6 + Math.random() * 8 + "s");
      orb.style.animationDelay = -Math.random() * 10 + "s";
      sky.appendChild(orb);
    }
    setInterval(() => {
      const star = document.createElement("span");
      star.className = "shooting";
      star.style.left = 30 + Math.random() * 80 + "vw";
      star.style.top = Math.random() * 50 + "vh";
      sky.appendChild(star);
      setTimeout(() => star.remove(), 1300);
    }, 2500);
  </script>
</body>
</html>
